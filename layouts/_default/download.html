{{ define "main" }}
<article class="container prose">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Description }}<p class="page-lede">{{ . }}</p>{{ end -}}
    <p class="page-meta">Latest release · v{{ site.Params.version }}</p>
  </header>
  <div class="page-content">
    {{ .Content }}
  </div>
</article>
{{ end }}

<header class="site-header">
  <div class="container site-header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Mythos — home">
      {{ partial "logo.html" . }}
      <span class="brand-name">mythos</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{- range site.Menus.main -}}
        <li>
          <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a>
        </li>
        {{- end -}}
      </ul>
    </nav>
    <div class="site-actions">
      <a class="icon-link" href="{{ site.Params.gitlab }}" aria-label="GitLab repository" target="_blank" rel="noopener">

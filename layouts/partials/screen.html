<div class="screen" aria-hidden="true">
  <div class="screen__chrome">
    <span></span><span></span><span></span>
    <p class="screen__url">mythos.home / library</p>
  </div>
  <div class="screen__body">
    <aside class="screen__side">
      <div class="screen__brand">
        {{ partial "logo.html" . }}
      </div>
      <ul>
        <li class="is-active">Films</li>
        <li>Shows</li>
        <li>Music</li>
        <li>Photos</li>
        <li>Watch later</li>
      </ul>
      <div class="screen__user">
        <span class="screen__avatar">M</span>
        <span>Matt</span>
      </div>
    </aside>
    <section class="screen__main">
      <header class="screen__head">
        <div>
          <small>Continue watching</small>
          <h4>Tonight's library</h4>
        </div>
        <div class="screen__pill">3.2 TB · 1,184 titles</div>
      </header>
      <div class="screen__row">
        <div class="poster poster--1"><span>The Princess Bride</span></div>
        <div class="poster poster--2"><span>Spirited Away</span></div>
        <div class="poster poster--3"><span>My Neighbor Totoro</span></div>
        <div class="poster poster--4"><span>Paddington 2</span></div>
        <div class="poster poster--5"><span>The Iron Giant</span></div>
      </div>
      <header class="screen__head screen__head--small">
        <small>Recently added</small>
      </header>
      <div class="screen__row screen__row--sm">
        <div class="poster poster--6"></div>
        <div class="poster poster--7"></div>
        <div class="poster poster--8"></div>
        <div class="poster poster--9"></div>
        <div class="poster poster--10"></div>
        <div class="poster poster--11"></div>
      </div>
    </section>
  </div>
</div>

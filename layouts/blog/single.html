{{ define "main" }}
<article class="post">
  <div class="container container--narrow">
    <header class="post__head">
      <p class="eyebrow"><a href="{{ "/blog/" | relURL }}">Blog</a></p>
      <h1>{{ .Title }}</h1>
      <p class="post__meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        {{ with .Params.tags }} · {{ delimit . ", " }}{{ end }}
      </p>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}

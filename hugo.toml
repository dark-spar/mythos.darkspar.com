baseURL = "https://mythos.darkspar.com/"
locale = "en-us"
title = "mythos"
enableRobotsTXT = true
enableEmoji = false

defaultContentLanguage = "en"

[languages]
  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 1

[params]
  description = "A self-hosted media server in Rust. Single binary, embedded SvelteKit UI, SQLite, HLS transcoding with hardware acceleration and HDR→SDR tonemapping. Movies and TV today; music, photos, books next."
  tagline = "Your stories, your hearth."
  author = "Matt Moore"
  gitlab = "https://gitlab.com/darkspar/mythos"
  repo = "https://gitlab.com/darkspar/mythos"
  version = "0.1.0-dev"

[params.hero]
  eyebrow = "Rust · MIT · early development"
  heading = "A self-hosted media server in Rust."
  subheading = "Mythos is a single-binary media server with an embedded SvelteKit UI. It scans your library, enriches metadata from TMDb, streams direct-play when it can and hardware-accelerated HLS — with HDR→SDR tonemapping — when it can't. Movies and TV are wired up today."

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 20
  [[menu.main]]
    name = "Download"
    pageRef = "/download"
    weight = 30
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 40

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[taxonomies]
  tag = "tags"

[build]
  writeStats = true
